<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Meow</title>
  <desc id="desc">Frontend developer. Building Piko, an AI assistant. Continuously improving.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f7"/>
      <stop offset="0.55" stop-color="#fbeef6"/>
      <stop offset="1" stop-color="#f1ebff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="220" rx="24"/>
    </clipPath>
    <path id="sparkle" d="M0 -9 C1.2 -2.4 2.4 -1.2 9 0 C2.4 1.2 1.2 2.4 0 9 C-1.2 2.4 -2.4 1.2 -9 0 C-2.4 -1.2 -1.2 -2.4 0 -9 Z"/>
  </defs>

  <style>
    .blob { animation: float 14s ease-in-out infinite; }
    .b2 { animation-duration: 17s; animation-direction: reverse; }
    .b3 { animation-duration: 20s; animation-delay: -6s; }

    .star { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .st2 { animation-delay: -0.8s; }
    .st3 { animation-delay: -1.6s; }
    .st4 { animation-delay: -2.4s; }

    .title {
      font: 700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      fill: #5b4b63;
      letter-spacing: -0.5px;
    }
    .sub {
      font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      fill: #8a7891;
      opacity: 0;
      animation: cycle 9s ease-in-out infinite both;
    }
    .s2 { animation-delay: 3s; }
    .s3 { animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(28px, -14px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      6%, 28% { opacity: 1; transform: translateY(0); }
      34%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .star, .sub { animation: none; }
      .s1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <g filter="url(#soft)" opacity="0.8">
      <circle class="blob" cx="150" cy="60" r="95" fill="#c9f0df"/>
      <circle class="blob b2" cx="860" cy="175" r="115" fill="#f9cfe0"/>
      <circle class="blob b3" cx="640" cy="20" r="85" fill="#e2d6ff"/>
    </g>

    <g transform="translate(212 58)"><use href="#sparkle" class="star" fill="#e8739e"/></g>
    <g transform="translate(790 54) scale(0.7)"><use href="#sparkle" class="star st2" fill="#7cc7a8"/></g>
    <g transform="translate(118 162) scale(0.6)"><use href="#sparkle" class="star st3" fill="#b8a4e3"/></g>
    <g transform="translate(886 120) scale(0.85)"><use href="#sparkle" class="star st4" fill="#f3b0c8"/></g>

    <text x="500" y="112" text-anchor="middle" class="title">Hi, I'm <tspan fill="#e8739e">Meow</tspan> 😺</text>

    <text x="500" y="160" text-anchor="middle" class="sub s1">Frontend developer</text>
    <text x="500" y="160" text-anchor="middle" class="sub s2">Building Piko, an AI assistant</text>
    <text x="500" y="160" text-anchor="middle" class="sub s3">Continuously improving ✨</text>
  </g>

  <rect x="1" y="1" width="998" height="218" rx="23" fill="none" stroke="#f5d0e0" stroke-width="2"/>
</svg>
